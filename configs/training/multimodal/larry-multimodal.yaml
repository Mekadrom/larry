training:
  metrics_backend: tensorboard
model:
  type: LarryMultimodalModelConfig
  include_modes:
    - text
    - voice
  include_tasks:
    - text_only
    - text_voice
    - voice_text
  text_prelude_config:
    vocab_size: 16392
    d_model: 1024
    max_seq_len: 2048
    n_layers: 2
  voice_prelude_config:
    vocab_size: 6561
    fsq_levels: [3, 3, 3, 3, 3, 3, 3, 3]
    d_model: 1024
    max_seq_len: 2048
    n_layers: 2
  recurrent_trunk_config:
    d_model: 1024
    max_seq_len: 2048
    n_layers: 4
  text_coda_config:
    vocab_size: 16392
    d_model: 1024
    max_seq_len: 2048
    n_layers: 2
  voice_coda_config:
    vocab_size: 6562
    d_model: 1024
    max_seq_len: 2048
    n_layers: 2
    depth_n_layers: 2
trainer:
  type: LarryMultimodalTrainerConfig
  processor_model_path: /home/zadar/.cache/larry/processors/multimodal/larry-multimodal/
  speech_encoder_model_path: /home/zadar/.cache/larry/models/voice/larry-speech-encoder/
  text_vocab_size: 16384
  voice_units_per_position: 1
  lr: 0.0005
  min_lr: 5.0e-05
  lr_scheduler_name: cosine
  warmup_steps: 2000
  weight_decay: 0.1
  max_steps: 100000
  eval_steps: 2000
  viz_steps: 2000
  mixture_config:
    max_batch_tokens: 16384
    pool_size: 30000
