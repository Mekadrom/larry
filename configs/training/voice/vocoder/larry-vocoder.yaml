training:
  metrics_backend: tensorboard
model:
  type: LarryVocoderConfig
  stft_scale: 2.72
trainer:
  type: VocoderTrainerConfig
  muon_last_layer_names:
    - backbone.out.weight
  lr: 0.0005
  min_lr: 5.0e-05
  lr_scheduler_name: cosine
  warmup_steps: 2000
  weight_decay: 0.1
  max_steps: 100000
  eval_steps: 2000
  viz_steps: 2000
  crop_seconds: 2.0
  crops_per_clip: 4
  clips_per_batch: 32
