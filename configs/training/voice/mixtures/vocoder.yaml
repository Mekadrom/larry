trainer:
  mixture_config:
    sample_rate: 16000
    max_batch_seconds: 900
    pool_size: 30000
    train_sources:
      scotus:
        index_path: thelarryproject/scotus-index-vocoder
        source_path: thelarryproject/scotus
        split: train
        weight: 0.09
      vctk:
        index_path: thelarryproject/vctk-index-vocoder
        source_path: thelarryproject/vctk-normalized-asr
        split: train
        weight: 0.06
      cv27:
        index_path: thelarryproject/common-voice-27-index-vocoder
        source_path: /home/zadar/.cache/larry/datasets/normalized/voice/mozilla-foundation_cv27-normalized/
        split: train
        weight: 0.12
      hifi-tts-all-clean:
        index_path: thelarryproject/hifi-tts-all-index-vocoder
        source_path: thelarryproject/hifi-tts-all-normalized-asr
        split: train.clean
        source_split: train.clean
        weight: 0.10
      hifi-tts-all-other:
        index_path: thelarryproject/hifi-tts-all-index-vocoder
        source_path: thelarryproject/hifi-tts-all-normalized-asr
        split: train.other
        source_split: train.other
        weight: 0.15
      lj-speech:
        index_path: thelarryproject/lj-speech-index-vocoder
        source_path: thelarryproject/lj-speech-normalized-asr
        weight: 0.03
      libriheavy-large-index:
        index_path: thelarryproject/libriheavy-large-index-vocoder
        source_path: mythicinfinity/libriheavy
        source_name: large
        source_split: train
        weight: 0.45
    eval_sources:
      scotus:
        index_path: thelarryproject/scotus-index-vocoder
        source_path: thelarryproject/scotus
        split: validation
      vctk:
        index_path: thelarryproject/vctk-index-vocoder
        source_path: thelarryproject/vctk-normalized-asr
        split: validation
        source_split: validation
      cv27:
        index_path: thelarryproject/common-voice-27-index-vocoder
        source_path: /home/zadar/.cache/larry/datasets/normalized/voice/mozilla-foundation_cv27-normalized/
        split: validation
        source_split: dev
      hifi-tts-all-clean:
        index_path: thelarryproject/hifi-tts-all-index-vocoder
        source_path: thelarryproject/hifi-tts-all-normalized-asr
        split: dev.clean
        source_split: dev.clean
      hifi-tts-all-other:
        index_path: thelarryproject/hifi-tts-all-index-vocoder
        source_path: thelarryproject/hifi-tts-all-normalized-asr
        split: dev.other
        source_split: dev.other
      librispeech-asr:
        index_path: thelarryproject/librispeech-asr-index-vocoder-validation
        source_path: thelarryproject/librispeech-asr-validation
      libriheavy-test-clean-large:
        index_path: thelarryproject/libriheavy-test_clean_large-index-vocoder
        source_path: thelarryproject/libriheavy-test-clean-large-normalized-asr
      libriheavy-test-other-large:
        index_path: thelarryproject/libriheavy-test_other_large-index-vocoder
        source_path: thelarryproject/libriheavy-test-other-large-normalized-asr
