          split: validation
        - name: vctk
          index_path: /home/zadar/.cache/larry/datasets/normalized/voice/asr/thelarryproject_vctk-normalized-asr/
          split: validation
        - name: cv27-index-asr
          index_path: /home/zadar/.cache/larry/datasets/index/voice/asr/mozilla-foundation_cv27-index-asr/
          split: validation
          source_path: /home/zadar/.cache/larry/datasets/normalized/voice/mozilla-foundation_cv27-normalized/
          source_split: validation
        - name: hifi-tts-all
