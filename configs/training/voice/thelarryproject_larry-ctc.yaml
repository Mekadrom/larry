training:
  metricsBackend: tensorboard

model:
  name: SpeechTokenizerModel
  config: SpeechTokenizerModelConfig

trainer:
  name: SpeechTokenizerTrainer
  config: SpeechTokenizerTrainerConfig
  overrides:
    tokenizer_model_path: ""
    muon_last_layer_names:
      - ctc_head.weight
    max_steps: 100000
    eval_steps: 2000
    viz_steps: 1000
    dataset_config:
      sample_rate: 16000
      max_batch_seconds: 400
      pool_size: 10000
      train_sources:
        - name: libriheavy-index-asr
          index_path: /home/zadar/.cache/larry/datasets/voice/index/asr/mythicinfinity_libriheavy-large-index/
          source_path: mythicinfinity/libriheavy
          source_name: large
          source_split: train
          weight: 0.65
        - name: cv27-index-asr
          index_path: /home/zadar/.cache/larry/datasets/voice/index/asr/thelarryproject_cv27-index/
          source_path: /home/zadar/.cache/larry/datasets/voice/normalized/asr/thelarrypropject_cv27-normalized/
          weight: 0.13
        - name: scotus-normalized-asr
          index_path: /home/zadar/.cache/larry/datasets/voice/normalized/asr/thelarryproject_scotus-normalized-asr/
          split: train
          weight: 0.12
        - name: vctk-normalized-asr
          index_path: /home/zadar/.cache/larry/datasets/voice/normalized/asr/thelarryproject_vctk-normalized-asr/
          weight: 0.05
        - name: hifi-tts-all-normalized-asr
          index_path: /home/zadar/.cache/larry/datasets/voice/normalized/asr/mikhailt_hifi-tts-all-normalized-asr/
