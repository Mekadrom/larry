dataset:
  config: CommonVoiceMediaCachedDatasetConfig
  overrides:
    - name: download_extract_cache_dir
      value: /home/zadar/.cache/larry/download_extract/voice/tts/mozilla-foundation_cv27/
    - name: cache_dir
      value: /home/zadar/.cache/larry/intermediates/voice/tts/mozilla-foundation_cv27/

preprocessor:
  provenanceColumns:
    - "path"
    - "client_id"
    - "sentence_id"

pipeline:
  - name: ColumnValuesPruner
    config: ColumnValuesPrunerConfig
    inputs:
      - name: values
        value:
          - "0"
      - name: op
        value: "nmatches"
      - name: input_column
        value: "down_votes"
  - name: AudioDurationColumnPruner
    config: AudioDurationColumnPrunerConfig
    inputs:
      - name: input_column
        value: "audio_duration"
  - name: AudioQualityPruner
    config: AudioQualityPrunerConfigForTTS
  - name: MelExtractingMapper
    config: MelExtractingMapperConfig
    inputs:
      - name: remove_columns
        value:
          - "audio_duration"
          - "sentence_domain"
          - "up_votes"
          - "down_votes"
          - "age"
          - "gender"
          - "accents"
          - "variant"
          - "locale"
          - "segment"
  - name: TextNormalizingMapper
    config: TextMapperConfig
    inputs:
      - name: input_column
        value: "sentence"
  - name: TextTokenizingMapper
    config: SmolLM2TextTokenizingMapperConfig
