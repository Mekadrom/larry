preprocessor:
  inputs:
    provenance:
      id_columns:
        - id
        - speaker_id

dataset:
  config: DefaultDatasetConfig
  overrides:
    path: MikhailT/hifi-tts
    name: all
    split: ~
    cache_dir: /home/zadar/.cache/larry/intermediates/voice/normalized/asr/mikhailt_hifi-tts-all-normalized-asr/

pipeline:
  - name: ColumnCastingPreprocessor
    config: ColumnCastingPreprocessorConfig
    inputs:
      column_casts:
        audio: "audio_no_decode"
        # removes:
        #   - text (normalized lowercase text)
        #   - text_no_preprocessing (original text from gutenberg)
        text: ~
        text_no_preprocessing: ~
  - name: ColumnRenamingPreprocessor
    config: ColumnRenamingPreprocessorConfig
    inputs:
      column_name_mappings:
        duration: duration_s
        # the text_normalized column looks the most like what we want as input to the CTCScoreMapper
        text_normalized: text_original
        file: id
        speaker: speaker_id
  - name: AudioDurationColumnPruner
    config: AudioDurationColumnPrunerConfig
  - name: AudioQualityPruner
    config: AudioQualityPrunerConfigForASR
  - name: CTCScoreMapper
    config: CTCScoreMapperConfig
    inputs:
      text_column: text_original
  - name: ColumnValuesPruner
    config: ColumnValuesPrunerConfig
    inputs:
      input_columns:
        - ctc_mismatch
      op: "in_range"
      op_config:
        max_value: 1
