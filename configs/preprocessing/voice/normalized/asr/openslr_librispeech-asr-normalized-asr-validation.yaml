preprocessor:
  inputs:
    provenance:
      id_columns:
        - id
        - speaker_id
        - chapter_id

dataset:
  config: DefaultDatasetConfig
  overrides:
    path: openslr/librispeech_asr
    name: all
    split: validation.clean+validation.other
    cache_dir: /home/zadar/.cache/larry/intermediates/voice/normalized/asr/openslr_librispeech-asr-normalized-asr-validation/

pipeline:
  - name: ColumnCastingPreprocessor
    config: ColumnCastingPreprocessorConfig
    inputs:
      column_casts:
        audio: "audio_no_decode"
        file: ~
  - name: AudioDurationMapper
    config: AudioDurationMapperConfig
    inputs:
      batch_size: 8
      writer_batch_size: 8
  - name: ColumnRenamingPreprocessor
    config: ColumnRenamingPreprocessorConfig
    inputs:
      column_name_mappings:
        text: text_original
  - name: CTCScoreMapper
    config: CTCScoreMapperConfig
    inputs:
      num_proc: 4
      text_column: text_original
