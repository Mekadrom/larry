preprocessor:
  inputs:
    - name: provenance_columns
      value:
        - path
        - client_id
        - sentence_id

dataset:
  config: CommonVoiceDatasetConfig
  overrides:
    - name: download_extract_cache_dir
      value: /home/zadar/.cache/larry/download_extract/voice/mels/mozilla-foundation_cv27/
    - name: cache_dir
      value: /home/zadar/.cache/larry/intermediates/voice/mels/mozilla-foundation_cv27/

pipeline:
  - name: ColumnRenamingPreprocessor
    config: ColumnRenamingPreprocessorConfig
    inputs:
      - name: column_name_mappings
        value:
          audio_duration: duration_s
          sentence: text
  - name: ColumnCastingPreprocessor
    config: ColumnCastingPreprocessorConfig
    inputs:
      - name: column_casts
        value:
          audio: "audio_no_decode"
  - name: ColumnValuesPruner
    config: ColumnValuesPrunerConfig
    inputs:
      - name: op_config
        value:
          values:
            - "0"
      - name: op
        value: "matches"
      - name: input_column
        value: "down_votes"
  - name: AudioDurationColumnPruner
    config: AudioDurationColumnPrunerConfig
  - name: AudioQualityPruner
    config: AudioQualityPrunerConfigForTTS
  - name: CTCScorePruner
    config: CTCScorePrunerConfig
  - name: ColumnValuesPruner
    config: ColumnValuesPrunerConfig
    inputs:
      - name: op_config
        value:
          min_value:
            - -3
      - name: op
        value: "in_range"
      - name: input_column
        value: "ctc_mismatch"
  - name: TextNormalizingMapper
    config: TextMapperConfig
  - name: TextTokenizingMapper
    config: SmolLM2TextTokenizingMapperConfig
