preprocessor:
  inputs:
    default_batch_size: 8
    provenance:
      id_columns:
        - term
        - docket

dataset:
  config: DefaultDatasetConfig
  overrides:
    path: thelarryproject/scotus-unaligned
    cache_dir: /home/zadar/.cache/larry/intermediates/voice/aligned/thelarryproject_scotus-aligned/

pipeline:
  - name: SCOTUSSpeechSegmentationAligningMapper
    config: SCOTUSSpeechSegmentationAligningMapperConfig
    inputs:
      num_proc: 8
      batch_size: 1
      writer_batch_size: 4
      copy_columns:
        - term
        - docket
        - case_name
        - date_argued
        - pdf_url
        - page_url
  - name: CTCScoreMapper
    config: CTCScoreMapperConfig
    inputs:
      num_proc: 12
      text_column: text_original
  - name: SpeakerValidationSplittingPreprocessor
    config: SpeakerValidationSplittingPreprocessorConfig
    inputs:
      mode: matching
      matching_values:
        - "scotus:adv:GLEN GIFFORD"
        - "scotus:adv:WILLIAM BROCKMAN"
        - "scotus:adv:MORGAN RATNER"
        - "scotus:adv:TERESA SACHS"
