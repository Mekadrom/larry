preprocessor:
  inputs:
    provenance:
      id_columns:
        - id
        - client_id
        - sentence_id

dataset:
  config: DefaultDatasetConfig
  overrides:
    path: parquet
    name: ~
    split: ~
    data_dir: /home/zadar/.cache/larry/datasets/voice/normalized/mozilla-foundation_cv27-normalized/
    cache_dir: /home/zadar/.cache/larry/intermediates/voice/index/asr/mozilla-foundation_cv27-index-asr/

pipeline:
  - name: RowIndexAssigningPreprocessor
    config: RowIndexAssigningPreprocessorConfig
  - name: ColumnValuesPruner
    config: ColumnValuesPrunerConfig
    inputs:
      input_columns:
        - down_votes
      op: "matches"
      op_config:
        values:
          - 0
  - name: ColumnValuesPruner
    config: ASRCTCMismatchColumnValuesPrunerConfig
  - name: AudioDurationColumnPruner
    config: AudioDurationColumnPrunerConfig
  - name: AudioQualityPruner
    config: AudioQualityPrunerConfigForASR
  - name: ColumnCastingPreprocessor
    config: ColumnCastingPreprocessorConfig
    inputs:
      column_casts:
        audio: ~
