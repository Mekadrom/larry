preprocessor:
  inputs:
    provenance_columns:
      - speaker
      - file

dataset:
  config: DatasetConfig
  overrides:
    path: parquet
    name: ~
    split: ~
    data_dir: /home/zadar/.cache/larry/datasets/voice/normalized/mikhailt_hifi-tts-all-normalized/train/
    cache_dir: /home/zadar/.cache/larry/intermediates/voice/index/mikhailt_hifi-tts-all-index/

pipeline:
  - name: AudioDurationColumnPruner
    config: AudioDurationColumnPrunerConfig
  - name: AudioQualityPruner
    config: AudioQualityPrunerConfigForTTS
  - name: ColumnValuesPruner
    config: ColumnValuesPrunerConfig
    inputs:
      op_config:
        min_value:
          - -4
      op: "in_range"
      input_column: "ctc_mismatch"
