preprocessor:
  provenance:
    id_columns:
      - term
      - docket
dataset:
  type: SCOTUSManifestCachedDatasetConfig
  download_extract_cache_dir: /home/zadar/.cache/larry/download_extract/manifest/voice/thelarryproject_scotus-manifest/
  cache_dir: /home/zadar/.cache/larry/intermediates/manifest/voice/thelarryproject_scotus-manifest/
pipeline:
  override_values:
    type: ValueOverrideMapperConfig
    mappings:
      # the page for the reargument of Johnson v. United States points to the original argument's transcripts;
      # these mappings adjust for this singular case
      - input_column: docket
        input_column_value: 13-7120rearg
        output_column: pdf_url
        output_column_value: https://www.supremecourt.gov/oral_arguments/argument_transcripts/2014/13-7120_hd1a.pdf
      - input_column: docket
        input_column_value: 13-7120rearg
        output_column: date_argued
        output_column_value: '2015-04-20'
  cast_columns:
    type: ColumnCastingPreprocessorConfig
    column_casts:
      date_argued: date32
