preprocessor:
  default_batch_size: 8
  provenance:
    id_columns:
    - term
    - docket
dataset:
  type: DefaultDatasetConfig
  path: thelarryproject/scotus-manifest
  cache_dir: /home/zadar/.cache/larry/intermediates/other/voice/unaligned/thelarryproject_scotus-unaligned/
pipeline:
  download_pdf:
    type: UrlBytesMapperConfig
    busy_wait: 1.0
    num_proc: 1
    batch_size: 8
    writer_batch_size: 8
    input_column: pdf_url
    output_column: pdf_bytes
    filter_null_outputs: true
    validate_starts_with: '%PDF-'
  download_audio:
    type: UrlAudioMapperConfig
    busy_wait: 1.0
    num_proc: 1
    batch_size: 8
    writer_batch_size: 8
    input_column: mp3_url
    filter_null_outputs: true
  measure_duration:
    type: AudioDurationMapperConfig
    batch_size: 8
    writer_batch_size: 8
  extract_transcript_text:
    type: SCOTUSTranscriptPdfTextMapperConfig
    batch_size: 8
    writer_batch_size: 8
