preprocessor:
  provenance:
    id_columns:
      - id
dataset:
  type: TePapaCachedDatasetConfig
  download_extract_cache_dir: /home/zadar/.cache/larry/download_extract/normalized/image/te_papa-normalized/
  cache_dir: /home/zadar/.cache/larry/intermediates/normalized/image/te_papa-normalized/
  api_key_file: ~/.config/larry/tepapa_api_key
pipeline:
#  prune_do_not_train:
#    type: DoNotTrainPrunerConfig
#    input_columns:
#      - image_url
  download_image:
    type: UrlImageMapperConfig
    input_column: image_url
    num_proc: 2
    batch_size: 32
    writer_batch_size: 32
    busy_wait: 0.2
    filter_null_outputs: true
    download_cache_dir: /home/zadar/.cache/larry/download_extract/normalized/image/te_papa-normalized/images/
  resize_images:
    type: ImageResizingMapperConfig
    batch_size: 64
    filter_null_outputs: true
    width: 512
    height: 512
    pad_to_equal: false
    center_crop: false
