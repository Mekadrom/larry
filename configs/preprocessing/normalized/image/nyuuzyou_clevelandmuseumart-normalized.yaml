preprocessor:
  provenance:
    id_columns:
      - id
dataset:
  type: DefaultDatasetConfig
  path: nyuuzyou/ClevelandMuseumArt
  split: ~
  cache_dir: /home/zadar/.cache/larry/intermediates/normalized/image/nyuuzyou_clevelandmuseumart-normalized/
pipeline:
  prune_by_license:
    type: LicenseColumnValuesPrunerConfig
    input_columns:
      - share_license_status
  extract_image_url:
    type: NestedExtractionPreprocessorConfig
    input_column: images
    json_path_mappings:
      - json_path: "$.print.url"
        output_column: print_url
#  prune_do_not_train:
#    type: DoNotTrainPrunerConfig
#    input_columns:
#      - print_url
  download_image:
    type: UrlImageMapperConfig
    input_column: print_url
    busy_wait: 0.1
    num_proc: 1
    batch_size: 8
    writer_batch_size: 8
    filter_null_outputs: true
    download_cache_dir: /home/zadar/.cache/larry/download_extract/normalized/image/nyuuzyou_clevelandmuseumart-normalized/print/
  resize_images:
    type: ImageResizingMapperConfig
    batch_size: 64
    filter_null_outputs: true
    width: 512
    height: 512
    pad_to_equal: false
    center_crop: false
