preprocessor:
  provenance:
    id_columns:
      - id
dataset:
  type: SmithsonianOpenAccessCachedDatasetConfig
  download_extract_cache_dir: /home/zadar/.cache/larry/download_extract/normalized/image/smithsonian_open_access-normalized/
  cache_dir: /home/zadar/.cache/larry/intermediates/normalized/image/smithsonian_open_access-normalized/
  max_size: 960
pipeline:
#  prune_do_not_train:
#    type: DoNotTrainPrunerConfig
#    input_columns:
#      - image_url
  download_image:
    type: UrlImageMapperConfig
    input_column: image_url
    num_proc: 2
    batch_size: 64
    writer_batch_size: 64
    busy_wait: 0.0
    filter_null_outputs: true
    download_cache_dir: /home/zadar/.cache/larry/download_extract/normalized/image/smithsonian_open_access-normalized/images/
  resize_images:
    type: ImageResizingMapperConfig
    batch_size: 64
    filter_null_outputs: true
    width: 512
    height: 512
    pad_to_equal: false
    center_crop: false
