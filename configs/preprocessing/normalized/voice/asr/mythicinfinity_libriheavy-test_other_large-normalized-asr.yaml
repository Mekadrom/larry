preprocessor:
  provenance:
    id_columns:
      - id
      - speaker_id
      - librivox_book_id
dataset:
  type: DefaultDatasetConfig
  path: mythicinfinity/libriheavy
  name: test_other_large
  split: train
  cache_dir: /home/zadar/.cache/larry/intermediates/normalized/voice/asr/mythicinfinity_libriheavy-test_other_large-normalized-asr/
pipeline:
  skip_audio_decoding:
    type: ColumnCastingPreprocessorConfig
    column_casts:
      audio: audio_no_decode
      text_transcription: ~
  rename_columns:
    type: ColumnRenamingPreprocessorConfig
    column_name_mappings:
      audio_duration: duration_s
  prune_duration:
    type: AudioDurationColumnPrunerConfig
  prune_quality:
    type: AudioQualityPrunerConfigForASR
  score_ctc_mismatch:
    type: CTCScoreMapperConfig
    text_column: text_original
  prune_ctc_mismatch:
    type: ASRCTCMismatchColumnValuesPrunerConfig
