preprocessor:
  provenance:
    id_columns:
    - id
    - speaker_id
dataset:
  type: DefaultDatasetConfig
  path: MikhailT/hifi-tts
  name: all
  split: ~
  cache_dir: /home/zadar/.cache/larry/intermediates/normalized/voice/asr/mikhailt_hifi-tts-all-normalized-asr/
pipeline:
  skip_audio_decoding:
    type: ColumnCastingPreprocessorConfig
    column_casts:
      audio: audio_no_decode
      # removes:
      #   - text (normalized lowercase text)
      #   - text_no_preprocessing (original text from gutenberg)
      text: ~
      text_no_preprocessing: ~
  rename_columns:
    type: ColumnRenamingPreprocessorConfig
    column_name_mappings:
      duration: duration_s
      # the text_normalized column looks the most like what we want as input to the CTCScoreMapper
      text_normalized: text_original
      file: id
      speaker: speaker_id
  prune_duration:
    type: AudioDurationColumnPrunerConfig
  prune_quality:
    type: AudioQualityPrunerConfigForASR
  score_ctc_mismatch:
    type: CTCScoreMapperConfig
    num_proc: 4
    text_column: text_original
  prune_ctc_mismatch:
    type: ASRCTCMismatchColumnValuesPrunerConfig
