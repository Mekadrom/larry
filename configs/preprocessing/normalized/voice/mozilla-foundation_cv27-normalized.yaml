preprocessor:
  provenance:
    ancestry:
      datasets:
        - https://mozilladatacollective.com/datasets/cmu5jplf300nwmh07iqvk9leo
    id_columns:
      - id
      - speaker_id
      - sentence_id
dataset:
  type: CommonVoiceDatasetConfig
  download_extract_cache_dir: /home/zadar/.cache/larry/download_extract/normalized/voice/mozilla-foundation_cv27/
  cache_dir: /home/zadar/.cache/larry/intermediates/normalized/voice/mozilla-foundation_cv27-normalized/
pipeline:
  skip_audio_decoding:
    type: ColumnCastingPreprocessorConfig
    column_casts:
      audio: audio_no_decode
  rename_columns:
    type: ColumnRenamingPreprocessorConfig
    column_name_mappings:
      sentence: text_original
      path: id
      client_id: speaker_id
  score_ctc_mismatch:
    type: CTCScoreMapperConfig
    text_column: text_original
