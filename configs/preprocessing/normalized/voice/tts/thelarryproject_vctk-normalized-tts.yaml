preprocessor:
  inputs:
    provenance:
      id_columns:
        - id

dataset:
  config: DefaultDatasetConfig
  overrides:
    path: thelarryproject/vctk
    name: ~
    split: train
    cache_dir: /home/zadar/.cache/larry/intermediates/normalized/voice/tts/mikhailt_lj-speech-normalized-tts/

pipeline:
  - name: ColumnCastingPreprocessor
    config: ColumnCastingPreprocessorConfig
    inputs:
      column_casts:
        audio: "audio_no_decode"
  - name: ColumnValuesPruner
    config: ColumnValuesPrunerConfig
    inputs:
      input_columns:
        - mic_id
      op: matches
      op_config:
        values:
          - mic1
        containing: true
        strip: true
        case_sensitive: false
  - name: AudioDurationColumnPruner
    config: AudioDurationColumnPrunerConfig
  - name: ColumnValuesPruner
    config: TTSCTCMismatchColumnValuesPrunerConfig
  - name: AudioQualityPruner
    config: AudioQualityPrunerConfigForTTS
  - name: SpeakerValidationSplittingPreprocessor
    config: SpeakerValidationSplittingPreprocessorConfig
    inputs:
      mode: random
      validation_percent: 5
