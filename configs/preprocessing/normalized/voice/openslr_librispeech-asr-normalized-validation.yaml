preprocessor:
  provenance:
    id_columns:
    - id
    - speaker_id
    - chapter_id
dataset:
  type: DefaultDatasetConfig
  path: openslr/librispeech_asr
  name: all
  split: validation.clean+validation.other
  cache_dir: /home/zadar/.cache/larry/intermediates/normalized/voice/openslr_librispeech-asr-normalized-validation/
pipeline:
  skip_audio_decoding:
    type: ColumnCastingPreprocessorConfig
    column_casts:
      audio: audio_no_decode
      file: ~
  measure_duration:
    type: AudioDurationMapperConfig
    batch_size: 8
    writer_batch_size: 8
  rename_columns:
    type: ColumnRenamingPreprocessorConfig
    column_name_mappings:
      text: text_original
  score_ctc_mismatch:
    type: CTCScoreMapperConfig
    num_proc: 4
    text_column: text_original
