  path: /home/zadar/.cache/larry/datasets/normalized/voice/asr/mythicinfinity_libriheavy-test_other_large-normalized-asr/
  name: ~
  split: ~
  cache_dir: /home/zadar/.cache/larry/intermediates/index/voice/tts/mythicinfinity_libriheavy-test_other_large-index-tts/
pipeline:
  assign_row_index:
    type: RowIndexAssigningPreprocessorConfig
