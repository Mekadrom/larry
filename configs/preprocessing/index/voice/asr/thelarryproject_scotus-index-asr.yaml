preprocessor:
  default_batch_size: 8
  provenance:
    id_columns:
    - term
    - docket
dataset:
  type: DefaultDatasetConfig
  path: parquet
  name: ~
  split: ~
  data_dir: /home/zadar/.cache/larry/datasets/other/voice/aligned/thelarryproject_scotus-aligned/
  cache_dir: /home/zadar/.cache/larry/intermediates/index/voice/asr/thelarryproject_scotus-index-asr/
pipeline:
  assign_row_index:
    type: RowIndexAssigningPreprocessorConfig
  skip_audio_decoding:
    type: ColumnCastingPreprocessorConfig
    column_casts:
      audio: audio_no_decode
  prune_duration:
    type: AudioDurationColumnPrunerConfig
  prune_ctc_mismatch:
    type: ASRCTCMismatchColumnValuesPrunerConfig
  prune_quality:
    type: AudioQualityPrunerConfigForASR
  drop_audio:
    type: ColumnCastingPreprocessorConfig
    column_casts:
      audio: ~
  split_validation_speakers:
    type: SpeakerValidationSplittingPreprocessorConfig
    mode: matching
    matching_values:
    - scotus:adv:GLEN GIFFORD
    - scotus:adv:WILLIAM BROCKMAN
    - scotus:adv:SUSAN SMITH
    - scotus:adv:NATHANIEL ZELINSKY
    - scotus:adv:ANN ADAMS
    - scotus:adv:KRISSY NOBILE
    - scotus:adv:MEIR FEDER
    - scotus:adv:MARGIE PHELPS
