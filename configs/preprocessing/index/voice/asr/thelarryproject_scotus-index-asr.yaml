preprocessor:
  inputs:
    default_batch_size: 8
    provenance:
      id_columns:
        - term
        - docket

dataset:
  config: DefaultDatasetConfig
  overrides:
    path: parquet
    name: ~
    split: ~
    data_dir: /home/zadar/.cache/larry/datasets/normalized/voice/asr/thelarryproject_scotus-normalized/
    cache_dir: /home/zadar/.cache/larry/intermediates/index/voice/asr/thelarryproject_scotus-index-asr/

pipeline:
  - name: RowIndexAssigningPreprocessor
    config: RowIndexAssigningPreprocessorConfig
  - name: ColumnCastingPreprocessor
    config: ColumnCastingPreprocessorConfig
    inputs:
      column_casts:
        audio: "audio_no_decode"
  - name: AudioDurationColumnPruner
    config: AudioDurationColumnPrunerConfig
  - name: ColumnValuesPruner
    config: ASRCTCMismatchColumnValuesPrunerConfig
  - name: AudioQualityPruner
    config: AudioQualityPrunerConfigForASR
  - name: ColumnCastingPreprocessor
    config: ColumnCastingPreprocessorConfig
    inputs:
      column_casts:
        audio: ~
  - name: SpeakerValidationSplittingPreprocessor
    config: SpeakerValidationSplittingPreprocessorConfig
    inputs:
      mode: matching
      matching_values:
        - "scotus:adv:GLEN GIFFORD"
        - "scotus:adv:WILLIAM BROCKMAN"
        - "scotus:adv:SUSAN SMITH"
        - "scotus:adv:NATHANIEL ZELINSKY"
        - "scotus:adv:ANN ADAMS"
        - "scotus:adv:KRISSY NOBILE"
        - "scotus:adv:MEIR FEDER"
        - "scotus:adv:MARGIE PHELPS"
