preprocessor:
  provenance:
    id_columns:
      - id
      - speaker_id
      - librivox_book_id
dataset:
  type: DefaultDatasetConfig
  path: mythicinfinity/libriheavy
  name: large
  split: train
  cache_dir: /home/zadar/.cache/larry/intermediates/index/voice/asr/mythicinfinity_libriheavy-large-index-asr/
pipeline:
  assign_row_index:
    type: RowIndexAssigningPreprocessorConfig
  skip_audio_decoding:
    type: ColumnCastingPreprocessorConfig
    column_casts:
      audio: audio_no_decode
      text_transcription: ~
  rename_columns:
    type: ColumnRenamingPreprocessorConfig
    column_name_mappings:
      audio_duration: duration_s
  prune_duration:
    type: AudioDurationColumnPrunerConfig
  prune_quality:
    type: AudioQualityPrunerConfigForASR
  score_ctc_mismatch:
    type: CTCScoreMapperConfig
    text_column: text_original
    remove_columns:
    - audio
  prune_ctc_mismatch:
    type: ASRCTCMismatchColumnValuesPrunerConfig
