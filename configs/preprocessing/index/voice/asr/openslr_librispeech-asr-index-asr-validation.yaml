preprocessor:
  provenance:
    id_columns:
      - id
      - speaker_id
      - chapter_id
dataset:
  type: DefaultDatasetConfig
  path: thelarryproject/librispeech-asr-validation
  split: train
  cache_dir: /home/zadar/.cache/larry/intermediates/index/voice/asr/openslr_librispeech-asr-index-asr-validation/
pipeline:
  assign_row_index:
    type: RowIndexAssigningPreprocessorConfig
  skip_audio_decoding:
    type: ColumnCastingPreprocessorConfig
    column_casts:
      audio: audio_no_decode
  prune_ctc_mismatch:
    type: ASRCTCMismatchColumnValuesPrunerConfig
  prune_duration:
    type: AudioDurationColumnPrunerConfig
  prune_quality:
    type: AudioQualityPrunerConfigForASR
  drop_audio:
    type: RemoveColumnsPreprocessorConfig
    remove_columns:
    - audio
