[project]
name = "larry"
version = "1.0.0"
description = "The larry project."
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.0.1",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "torch>=2.9",
    "torchaudio>=2.9",
    "torchvision>=0.21.0",
    "torchcodec>=0.16.0",
    "transformers>=5.17.0",
    "jsonpath-ng>=1.8.0",
    "duckdb>=1.5.6",
    "matplotlib>=3.11.2",
    "librosa>=1.0.0",
    "wandb>=0.30.0",
    "trl>=1.14.1",
    "rotary-embedding-torch>=0.9.1",
    "dacite>=1.9.2",
    "tensorboard>=2.21.0",
    "pandas>=3.0.6",
    "gitpython>=3.2.0",
    "pypdf>=6.19.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[tool.ruff]
line-length = 122

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # Pyflakes
    "UP", # pyupgrade
    "B", # flake-bugbear
    "SIM", # flake8-simplify
    "I", # isort
    "D", # docs
    "ANN", # flake8 type annotations
]
ignore = [
    "D100", # docs for modules
    "D104", # docs for packages
    "D401", # `non-imperative-mood`
    "D404", # `docstring-starts-with-this`
    "D400", # end with period
    "D415", # end with punctuation
    "D203", # `incorrect-blank-line-before-class - incomptaible with (D203) `no-blank-line-before-class`
    "D213", # `multi-line-summary-second-line` - incompatible with (D212) `multi-line-summary-first-line`
    "ANN401", # disallows typing.Any
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
    "mypy",
    "basedpyright>=1.40.1",
]

[tool.basedpyright]
typeCheckingMode = "standard"
reportPrivateImportUsage = false

[project.scripts]
# uv run add-modality --help
add-modality = "buildscripts.add_modality:main"
# uv run preprocessing --help
preprocessing = "larry.common.data.preprocessing:main"
# uv run training --help
training = "larry.common.training:main"
